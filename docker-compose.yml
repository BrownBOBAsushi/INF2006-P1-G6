services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Dev convenience only — loopback-bound, not a public port. Drop before anything deployment-shaped.
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ./src/backend
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend_net
    volumes:
      - ./src/backend:/app  # dev bind mount for live reload
      - ./tests/backend:/app/tests/backend

volumes:
  db_data:

networks:
  backend_net: