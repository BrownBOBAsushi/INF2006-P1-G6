services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ./src/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./src/backend
    restart: unless-stopped
    env_file:
      - ./src/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
    environment:
      PROCESSING_TEMP_DIR: /var/lib/internship-matcher/temporary
      PROCESSING_TEMP_TTL_SECONDS: ${PROCESSING_TEMP_TTL_SECONDS:-3600}
    volumes:
      - processing_temp_data:/var/lib/internship-matcher/temporary
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 90s

  extraction-worker:
    build:
      context: ./src/backend
    restart: unless-stopped
    env_file:
      - ./src/.env
    environment:
      PROCESSING_TEMP_DIR: /var/lib/internship-matcher/temporary
      PROCESSING_TEMP_TTL_SECONDS: ${PROCESSING_TEMP_TTL_SECONDS:-3600}
    command: ["python", "-m", "app.processing.local_worker", "--kind", "EXTRACTION"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - processing_temp_data:/var/lib/internship-matcher/temporary
    networks:
      - backend_net

  embedding-worker:
    build:
      context: ./src/backend
    restart: unless-stopped
    env_file:
      - ./src/.env
    environment:
      PROCESSING_TEMP_DIR: /var/lib/internship-matcher/temporary
      PROCESSING_TEMP_TTL_SECONDS: ${PROCESSING_TEMP_TTL_SECONDS:-3600}
    command: ["python", "-m", "app.processing.local_worker", "--kind", "EMBEDDING"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - processing_temp_data:/var/lib/internship-matcher/temporary
    networks:
      - backend_net

  web:
    build:
      context: ./src/frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-REPLACE_WITH_GOOGLE_WEB_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend_net

volumes:
  db_data:
  processing_temp_data:

networks:
  backend_net:
