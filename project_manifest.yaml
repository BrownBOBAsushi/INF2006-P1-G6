architecture:
  diagram: "evidence/architecture.png" # editable source: evidence/architecture.svg
  service_model: "IaaS compute (EC2 instances running team-managed Docker containers, Nginx and FastAPI) with managed PaaS services: RDS PostgreSQL (DBaaS), SQS, S3, API Gateway HTTP API, Application Load Balancer, Secrets Manager, ECR, CloudWatch, Systems Manager. Google Identity Services is an external SaaS identity provider."
  deployment_model: "Public cloud (AWS us-east-1, Learner Lab account), single region, two Availability Zones for the web/API tier; deployed with CloudFormation stacks inf2006-private-base-retry1, inf2006-private-ingress and inf2006-private-app (state captured 2026-10-03). Local Docker Compose is the offline reproduction path."
  components:
    - "HttpApi: API Gateway HTTP API, public HTTPS entry point, private integration over VpcLink"
    - "InternalAlb: internal HTTPS Application Load Balancer with AppHttpsTargetGroup health checks"
    - "AppAutoScalingGroup: 2 x EC2 t3.small in private subnets across two AZs (Nginx web + FastAPI api containers)"
    - "WorkerInstanceRecovery: EC2 t3.medium running extraction (pdfplumber, Presidio) and embedding (all-MiniLM-L6-v2) workers"
    - "Database: RDS PostgreSQL 16 with pgvector, private, encrypted, Single-AZ"
    - "ExtractionQueue/EmbeddingQueue with ExtractionDlq/EmbeddingDlq: Amazon SQS"
    - "TemporaryInputBucket: S3 temporary PDF input, 1-day expiry, via S3Endpoint"
    - "Secrets Manager, ECR, CloudWatch Logs/Alarms, Systems Manager Session Manager, NatGatewayA/B"
    - "React/TypeScript single-page frontend served by Nginx"
