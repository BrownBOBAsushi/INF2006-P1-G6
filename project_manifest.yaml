  earlier_foundation_run: "evidence/cloud-foundation-run-2026-09-27.md"
data_ai:
  dataset: "data/README.md"
  method: "Requirement-level semantic matching: each job requirement is embedded with sentence-transformers/all-MiniLM-L6-v2 (pinned revision) and compared by cosine similarity with chunks of the student's approved, privacy-redacted résumé stored in PostgreSQL/pgvector; a job's score is the mean over its required requirements of each requirement's best cosine similarity to any résumé chunk, and each match shows the closest supporting résumé passage. Compared with keyword/BM25 and pooled-chunk embedding baselines."
  evaluation: "Precision@5 (strict/lenient) and NDCG@5 on 10 synthetic profiles x 30 synthetic jobs with a development/held-out split. Held-out MiniLM requirement-level 0.640 / 0.760 / 0.922 vs BM25 0.640 / 0.720 / 0.910 (2026-09-20; reproduced identically 2026-10-03). Labels: 90 team-member-supplied, 210 AI-drafted; results are provisional. See evidence/test-data-ai.md."
  reproducible_command: "python analytics/evaluate.py --fixtures data/evaluation"
security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: "Runtime secrets (database credentials, session signing key, DNS token) are stored in AWS Secrets Manager, fetched at instance boot into root-only (0600) environment files, and never placed in images, CloudFormation parameters, logs or the repository. src/.env.example contains placeholders only; local .env files are git-ignored."
run:
  prerequisites:
    - "Docker Engine with Docker Compose v2"
    - "Python 3.11 (analytics and infrastructure tests)"
    - "Node.js 24 and npm 11 (frontend tests and build)"
    - "Optional for full sign-in: a Google OAuth Web client ID configured for http://localhost:8080"
    - "Optional for cloud redeployment: an AWS account with the services listed in docs/PRIVATE_CLOUD_ROLLOUT.md (estimated ~0.26 USD/hour while running; see evidence/cloud-capture-2026-10-03/10-resource-inventory-and-cost.txt)"
  commands:
    - "cp src/.env.example src/.env  # then fill placeholder values locally"
    - "docker compose --env-file src/.env up -d --build  # app at http://localhost:8080"
    - "docker compose -f docker-compose.dev.yml --profile test build backend-tests && docker compose -f docker-compose.dev.yml --profile test run --rm backend-tests"
    - "python3 -m unittest discover -s tests/infra -p 'test_*.py'"
    - "cd src/frontend && npm ci && npm run typecheck && npm test && npm run build"
    - "python -m venv analytics/.venv && analytics/.venv/bin/pip install -r analytics/requirements.txt && analytics/.venv/bin/python analytics/evaluate.py --fixtures data/evaluation"
