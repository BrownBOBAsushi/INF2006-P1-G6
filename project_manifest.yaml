project:
  group_id: "P1-G5"
  title: "Internship Matcher"
  problem_statement: "Students struggle to judge which internship listings fit their skills. Internship Matcher lets a student sign in with Google, upload a résumé PDF, review and approve a privacy-redacted extraction, and receive internships ranked by requirement-level semantic similarity with the matching evidence shown for each requirement."
  cloud_provider: "AWS"
  repository_commit: "" # TEAM INPUT: final commit hash of the submitted tree
