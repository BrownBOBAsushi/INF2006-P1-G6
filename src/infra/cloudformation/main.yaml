AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Synchronous INF2006 web/API foundation only. This template creates a public
  API host and private Single-AZ RDS database. It does not create async workers,
  S3, SQS, or custom IAM resources.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/(1[6-9]|2[0-8])$'
    Description: Private RFC1918 CIDR for this isolated foundation VPC.
  ApiSubnetCidr:
    Type: String
    Default: 10.42.1.0/24
  DatabaseSubnetACidr:
    Type: String
    Default: 10.42.16.0/24
  DatabaseSubnetBCidr:
    Type: String
    Default: 10.42.17.0/24
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Reviewed x86_64 Amazon Linux 2023 AMI ID for the target region.
  ApiInstanceType:
    Type: String
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large]
    Description: >-
      Required sizing choice. Synchronous processing memory has not been
      measured in this environment; the live Docker probe was denied.
  DatabaseInstanceClass:
    Type: String
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]
    Description: Required after checking the lab's current orderable classes and cost.
  PostgresEngineVersion:
    Type: String
    AllowedPattern: '^16\.[0-9]+$'
    Description: Exact currently orderable PostgreSQL 16 minor, for example 16.15.
  DatabaseName:
    Type: String
    Default: internship_matcher
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,62}$'
  DatabaseMasterUsername:
    Type: String
    Default: dbadmin
    AllowedValues: [dbadmin]
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,62}$'
    Description: Master username only; its password comes from a Secrets Manager dynamic reference.
  DatabaseMasterPasswordSecretArn:
    Type: String
    AllowedPattern: '^arn:aws(-[a-z]+)?:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Existing secret JSON containing a password field. No secret value is accepted here.
  DatabaseMigratorSecretArn:
    Type: String
    AllowedPattern: '^arn:aws(-[a-z]+)?:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Existing secret JSON with username and password for app_migrator.
  DatabaseRuntimeSecretArn:
    Type: String
    AllowedPattern: '^arn:aws(-[a-z]+)?:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Existing secret JSON with username and password for app_runtime.
  AppSigningKeySecretArn:
    Type: String
    AllowedPattern: '^arn:aws(-[a-z]+)?:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Existing secret JSON with a key field for the application signing key.
  DuckDnsTokenSecretArn:
    Type: String
    AllowedPattern: '^arn:aws(-[a-z]+)?:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Existing secret JSON with a token field; read only by the explicit DNS update script.
  LabInstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Supplied Learner Lab instance profile; the template creates no IAM identities.
  PublicHostname:
    Type: String
    AllowedPattern: '^[A-Za-z0-9.-]+$'
    Description: Exact DuckDNS hostname selected before deployment.
  AppOrigin:
    Type: String
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
    Description: Exact HTTPS browser origin; configure the same Google GIS Authorized JavaScript origin.
  GoogleClientId:
    Type: String
    AllowedPattern: '^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$'
    Description: Public Google Web client ID used to build the frontend; not a secret.
  ApiImageUri:
    Type: String
    AllowedPattern: '^([0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com|[A-Za-z0-9./_-]+)@sha256:[a-f0-9]{64}$'
    Description: Immutable synchronous API image URI pinned by sha256 digest.
  WebImageUri:
    Type: String
    AllowedPattern: '^([0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com|[A-Za-z0-9./_-]+)@sha256:[a-f0-9]{64}$'
    Description: Immutable frontend/Nginx image URI pinned by sha256 digest.
  BootstrapImageUri:
    Type: String
    AllowedPattern: '^([0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com|[A-Za-z0-9./_-]+)@sha256:[a-f0-9]{64}$'
    Description: Immutable bootstrap/configuration image URI pinned by sha256 digest.
  SourceSnapshotSha256:
    Type: String
    AllowedPattern: '^[a-fA-F0-9]{64}$'
    Description: SHA-256 of the generated source snapshot manifest bound to the image labels.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30]

Resources:
  FoundationVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-vpc'}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FoundationVpc
      InternetGatewayId: !Ref InternetGateway

  ApiPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref ApiSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-api-public'}]
  DatabasePrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref DatabaseSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-db-private-a'}]
  DatabasePrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref DatabaseSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-db-private-b'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FoundationVpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref ApiPublicSubnet

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP challenge/redirect and HTTPS for Nginx only.
      VpcId: !Ref FoundationVpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No public ingress; PostgreSQL is reachable from the API security group only.
      VpcId: !Ref FoundationVpc
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0}
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiSecurityGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Two-AZ placement coverage only; database is Single-AZ.
      SubnetIds: [!Ref DatabasePrivateSubnetA, !Ref DatabasePrivateSubnetB]
      DBSubnetGroupName: !Sub '${AWS::StackName}-db-subnets'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref PostgresEngineVersion
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: 20
      StorageType: gp2
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: false
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseMasterUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseMasterPasswordSecretArn}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      MonitoringInterval: 0
      DeletionProtection: false
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-postgres'}]

  ApiHostLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Sub '/inf2006/${AWS::StackName}/api'
      RetentionInDays: !Ref LogRetentionDays
  ApiHost:
    Type: AWS::EC2::Instance
    DependsOn:
      - Database
      - PublicDefaultRoute
      - PublicRouteAssociation
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT45M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref ApiInstanceType
      IamInstanceProfile: !Ref LabInstanceProfileName
      SubnetId: !Ref ApiPublicSubnet
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      CreditSpecification: {CPUCredits: standard}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 24
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              DOCKER_CONFIG=''
              signal_stack='${AWS::StackName}'
              signal_region='${AWS::Region}'
              signal_resource='ApiHost'
              signal_on_exit() {
                status=$?
                trap - EXIT
                if [[ -n "$DOCKER_CONFIG" ]]; then
                  rm -rf "$DOCKER_CONFIG" || true
                fi
                if [[ -x /opt/aws/bin/cfn-signal ]]; then
                  /opt/aws/bin/cfn-signal --exit-code "$status" --stack "$signal_stack" --resource "$signal_resource" --region "$signal_region" || true
                fi
                exit "$status"
              }
              trap signal_on_exit EXIT
              exec > >(tee -a /var/log/inf2006-bootstrap.log | logger -t inf2006-bootstrap -s 2>/dev/console) 2>&1
              dnf install -y aws-cfn-bootstrap
              dnf install -y awscli-2 docker nginx postgresql16 jq python3
              install -d -m 0755 /usr/local/lib/docker/cli-plugins
              compose_tmp="$(mktemp)"
              curl --fail --silent --show-error --location \
                https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 \
                --output "$compose_tmp"
              printf '%s  %s\n' '7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4' "$compose_tmp" | sha256sum --check --status
              install -m 0755 "$compose_tmp" /usr/local/lib/docker/cli-plugins/docker-compose
              rm -f "$compose_tmp"
              docker compose version
              systemctl enable --now docker nginx
              install -d -m 0750 /opt/inf2006
              export AWS_DEFAULT_REGION='${AWS::Region}'
              export BOOTSTRAP_IMAGE_URI='${BootstrapImageUri}'
              export API_IMAGE_URI='${ApiImageUri}'
              export WEB_IMAGE_URI='${WebImageUri}'
              export APP_ORIGIN='${AppOrigin}'
              export PUBLIC_HOSTNAME='${PublicHostname}'
              export GOOGLE_CLIENT_ID='${GoogleClientId}'
              export DB_ENDPOINT='${DbEndpoint}'
              export DB_NAME='${DatabaseName}'
              export DB_RUNTIME_SECRET_ARN='${DatabaseRuntimeSecretArn}'
              export DB_MASTER_SECRET_ARN='${DatabaseMasterPasswordSecretArn}'
              export DB_MIGRATOR_SECRET_ARN='${DatabaseMigratorSecretArn}'
              export APP_SIGNING_KEY_SECRET_ARN='${AppSigningKeySecretArn}'
              export DUCKDNS_TOKEN_SECRET_ARN='${DuckDnsTokenSecretArn}'
              export SOURCE_SNAPSHOT_SHA256='${SourceSnapshotSha256}'
              export LOG_GROUP='${LogGroup}'
              registry="$(printf '%s' "$BOOTSTRAP_IMAGE_URI" | cut -d/ -f1)"
              export DOCKER_CONFIG="$(mktemp -d)"
              aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$registry"
              docker pull "$BOOTSTRAP_IMAGE_URI"
              container_id="$(docker create "$BOOTSTRAP_IMAGE_URI")"
              docker cp "$container_id:/opt/inf2006/." /opt/inf2006/
              docker rm "$container_id"
              chmod 0750 /opt/inf2006/src/infra/scripts/*.sh
              /opt/inf2006/src/infra/scripts/bootstrap-api.sh
            - DbEndpoint: !GetAtt Database.Endpoint.Address
              LogGroup: !Ref ApiHostLogGroup
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-api'}
        - {Key: SourceSnapshotSha256, Value: !Ref SourceSnapshotSha256}

  ApiHostStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API host EC2 system or instance status check failed.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref ApiHost}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching

  ApiReadinessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: /health/ready custom metric is below one for the API host.
      Namespace: INF2006/Service
      MetricName: Ready
      Dimensions: [{Name: InstanceId, Value: !Ref ApiHost}]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

Outputs:
  PublicIpv4Address:
    Description: Public IPv4 to publish in the selected DuckDNS A record after approval.
    Value: !GetAtt ApiHost.PublicIp
  PublicHostname:
    Value: !Ref PublicHostname
  DatabaseEndpoint:
    Description: Private endpoint; reachable only from ApiSecurityGroup on TCP 5432.
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  ApiHostInstanceId:
    Value: !Ref ApiHost
