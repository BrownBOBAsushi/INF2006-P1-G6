map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format inf2006_sanitized '$remote_addr $time_iso8601 "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log inf2006_sanitized;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    access_log /var/log/nginx/access.log inf2006_sanitized;
    ssl_certificate /etc/letsencrypt/live/INF2006_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/INF2006_HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
