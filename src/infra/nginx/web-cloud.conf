log_format inf2006_sanitized '$remote_addr $time_iso8601 "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent';

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    access_log /dev/stdout inf2006_sanitized;
    error_log /dev/stderr warn;

    client_max_body_size 6m;

    location = /health/live {
        proxy_pass http://api:8000/health/live;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location = /health/ready {
        proxy_pass http://api:8000/health/ready;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
