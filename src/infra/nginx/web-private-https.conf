log_format inf2006_sanitized '$remote_addr $time_iso8601 "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent';

server {
    listen 8443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout inf2006_sanitized;
    error_log /dev/stderr warn;

    # ALB encrypts this target hop but does not validate the per-instance certificate.
    ssl_certificate /etc/inf2006/tls/target.crt;
    ssl_certificate_key /etc/inf2006/tls/target.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    location = /health/live {
        proxy_pass http://api:8000/health/live;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location = /health/ready {
        proxy_pass http://api:8000/health/ready;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    # Build assets must return a real 404 when absent; do not serve index.html as JavaScript/CSS.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|otf)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
