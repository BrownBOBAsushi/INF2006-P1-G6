map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format inf2006_sanitized '$remote_addr $time_iso8601 "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log inf2006_sanitized;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 503; }
}
