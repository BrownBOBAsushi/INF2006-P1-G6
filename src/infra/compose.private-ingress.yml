services:
  api:
    image: ${API_IMAGE_URI:?set an immutable API image URI}
    restart: unless-stopped
    env_file:
      - /etc/inf2006/api.env
    volumes:
      - /etc/pki/tls/certs/rds-global-bundle.pem:/etc/ssl/certs/rds-global-bundle.pem:ro
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 120s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: ${LOG_GROUP:?set LOG_GROUP}
        awslogs-stream: ${INSTANCE_ID:?set INSTANCE_ID}/api
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 4m

  web:
    image: ${WEB_IMAGE_URI:?set an immutable web image URI}
    restart: unless-stopped
    volumes:
      - /opt/inf2006/src/infra/nginx/web-private-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/inf2006/tls:/etc/inf2006/tls:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8443:8443"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: ${WEB_LOG_GROUP:?set WEB_LOG_GROUP}
        awslogs-stream: ${INSTANCE_ID:?set INSTANCE_ID}/web
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 1m
