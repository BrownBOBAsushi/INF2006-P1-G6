<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1290" width="1800" height="1290" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12.5px;fill:#374151}
      .z{font-size:13px;font-weight:700}
      .n{font-size:13px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#374151;stroke-width:1.4;rx:6}
      .ln{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#a)}
      .eg{stroke:#b45309;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#b)}
    </style>
  </defs>
  <rect width="1800" height="1290" fill="#ffffff"/>
  <text x="20" y="34" font-size="24" font-weight="700" fill="#111827">Internship Matcher — deployed AWS architecture (us-east-1)</text>
  <text x="20" y="58" class="s">Labels are CloudFormation logical IDs from src/infra/cloudformation/{private-base,ingress-http-api,private-app}.yaml. Deployed state captured read-only 2026-10-03: evidence/cloud-capture-2026-10-03/.</text>

  <!-- Internet trust zone -->
  <rect x="20" y="80" width="240" height="1010" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="8 5" rx="8"/>
  <text x="34" y="104" class="z" fill="#b91c1c">Public Internet (untrusted)</text>
  <rect x="40" y="180" width="200" height="120" class="box"/>
  <text x="54" y="205" class="t">Student browser</text>
  <text x="54" y="226" class="s">React SPA</text>
  <text x="54" y="244" class="s">HttpOnly Secure session</text>
  <text x="54" y="262" class="s">cookie + CSRF token</text>
  <text x="54" y="280" class="s">synthetic résumé PDFs only</text>
  <rect x="40" y="690" width="200" height="120" class="box"/>
  <text x="54" y="715" class="t">Google Identity</text>
  <text x="54" y="733" class="t">Services (SaaS)</text>
  <text x="54" y="754" class="s">GIS sign-in issues an</text>
  <text x="54" y="772" class="s">ID token; API verifies</text>
  <text x="54" y="790" class="s">issuer, audience, expiry</text>
  <path d="M140,300 L140,688" class="ln" marker-start="url(#a)"/>
  <circle cx="140" cy="490" r="13" fill="#7c3aed"/><text x="135" y="495" class="n">G</text>

  <!-- AWS account -->
  <rect x="275" y="70" width="1510" height="1030" fill="none" stroke="#f59e0b" stroke-width="2" rx="10"/>
  <text x="290" y="94" class="z" fill="#b45309">AWS account · Learner Lab · us-east-1</text>

  <!-- API Gateway -->
  <rect x="295" y="170" width="215" height="160" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4" rx="6"/>
  <text x="308" y="194" class="t">HttpApi</text>
  <text x="308" y="212" class="s">API Gateway HTTP API</text>
  <text x="308" y="232" class="s">public execute-api origin</text>
  <text x="308" y="250" class="s">$default route →</text>
  <text x="308" y="268" class="s">ProxyIntegration: HTTP_PROXY</text>
  <text x="308" y="286" class="s">over VPC_LINK, 30 s timeout</text>
  <text x="308" y="304" class="s">TLS server-name verified</text>
  <text x="308" y="322" class="s">AccessLogGroup</text>
  <path d="M240,235 L293,235" class="ln"/>
  <circle cx="266" cy="218" r="12" fill="#2563eb"/><text x="262" y="223" class="n">1</text>

  <!-- VPC -->
  <rect x="530" y="100" width="800" height="985" fill="#f8fafc" stroke="#7c3aed" stroke-width="2" rx="8"/>
  <text x="545" y="122" class="z" fill="#6d28d9">Vpc — private trust boundary (no instance has a public IP)</text>

  <!-- public subnets -->
  <rect x="550" y="135" width="370" height="95" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4" rx="6"/>
  <text x="562" y="155" class="z" fill="#15803d">PublicSubnetA · us-east-1a</text>
  <rect x="570" y="165" width="330" height="52" class="box"/>
  <text x="582" y="186" class="t">NatGatewayA</text><text x="582" y="206" class="s">outbound only → InternetGateway</text>
  <rect x="940" y="135" width="370" height="95" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4" rx="6"/>
  <text x="952" y="155" class="z" fill="#15803d">PublicSubnetB · us-east-1b</text>
  <rect x="960" y="165" width="330" height="52" class="box"/>
  <text x="972" y="186" class="t">NatGatewayB</text><text x="972" y="206" class="s">outbound only → InternetGateway</text>

  <!-- private app subnets -->
  <rect x="550" y="245" width="370" height="530" fill="#faf5ff" stroke="#9333ea" stroke-dasharray="6 4" rx="6"/>
  <text x="562" y="265" class="z" fill="#7e22ce">AppSubnetA · us-east-1a (private)</text>
  <rect x="940" y="245" width="370" height="530" fill="#faf5ff" stroke="#9333ea" stroke-dasharray="6 4" rx="6"/>
  <text x="952" y="265" class="z" fill="#7e22ce">AppSubnetB · us-east-1b (private)</text>

  <rect x="570" y="278" width="720" height="50" class="box"/>
  <text x="582" y="299" class="t">VpcLink ENIs</text>
  <text x="582" y="318" class="s">VpcLinkSecurityGroup: no inbound; egress TCP 443 to InternalAlbSecurityGroup only</text>
  <path d="M510,250 L568,296" class="ln"/>
  <circle cx="539" cy="258" r="12" fill="#2563eb"/><text x="535" y="263" class="n">2</text>

  <rect x="570" y="350" width="720" height="68" class="box"/>
  <text x="582" y="372" class="t">InternalAlb · InternalAlbHttpsListener</text>
  <text x="582" y="391" class="s">internal ALB · HTTPS 443 · ELBSecurityPolicy-TLS13-1-2-2021-06 · inbound only from VpcLinkSecurityGroup</text>
  <text x="582" y="409" class="s">AppHttpsTargetGroup: HTTPS 8443, health check GET /health/ready every 30 s (2 failures = unhealthy)</text>
  <path d="M930,328 L930,348" class="ln"/>

  <rect x="570" y="445" width="330" height="150" class="box"/>
  <text x="582" y="467" class="t">App instance A · t3.small</text>
  <text x="582" y="487" class="s">web: Nginx — SPA, TLS :8443, 6 MiB body cap,</text>
  <text x="582" y="504" class="s">sanitised access log (no query string)</text>
  <text x="582" y="523" class="s">api: FastAPI — Google token check, DB</text>
  <text x="582" y="540" class="s">sessions, CSRF, ownership, validation,</text>
  <text x="582" y="557" class="s">matching, outbox publisher</text>
  <text x="582" y="580" class="s">AppTargetSecurityGroup: 8443 from ALB only</text>
  <rect x="960" y="445" width="330" height="150" class="box"/>
  <text x="972" y="467" class="t">App instance B · t3.small</text>
  <text x="972" y="487" class="s">same containers and controls as A</text>
  <text x="972" y="507" class="s">(AppLaunchTemplate, digest-pinned</text>
  <text x="972" y="524" class="s">ECR images, IMDSv2 required)</text>
  <text x="972" y="557" class="s">AppSecurityGroup: no inbound rules</text>
  <text x="972" y="580" class="s">AppTargetSecurityGroup: 8443 from ALB only</text>
  <path d="M735,418 L735,443" class="ln"/><path d="M1125,418 L1125,443" class="ln"/>
  <circle cx="760" cy="431" r="12" fill="#2563eb"/><text x="756" y="436" class="n">3</text>
  <rect x="570" y="603" width="720" height="24" fill="#ede9fe" stroke="#7c3aed" rx="4"/>
  <text x="582" y="620" class="s" font-weight="700">AppAutoScalingGroup: 2 instances · ELB health checks</text>

  <rect x="570" y="640" width="330" height="122" class="box"/>
  <text x="582" y="662" class="t">WorkerInstanceRecovery · t3.medium</text>
  <text x="582" y="682" class="s">extraction service: pdfplumber + Presidio</text>
  <text x="582" y="699" class="s">redaction (sandboxed child process)</text>
  <text x="582" y="716" class="s">embedding service: all-MiniLM-L6-v2</text>
  <text x="582" y="736" class="s">WorkerSecurityGroup: no inbound; egress</text>
  <text x="582" y="753" class="s">5432 to DB, 443 and DNS only</text>

  <!-- database subnets -->
  <rect x="550" y="790" width="760" height="170" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6 4" rx="6"/>
  <text x="562" y="808" class="z" fill="#1d4ed8">DatabaseSubnetA/B</text><text x="562" y="826" class="s">no Internet</text><text x="562" y="843" class="s">route</text>
  <rect x="700" y="822" width="470" height="126" class="box"/>
  <text x="714" y="845" class="t">Database · RDS PostgreSQL 16.15 + pgvector</text>
  <text x="714" y="865" class="s">db.t3.micro, Single-AZ (no standby), storage encrypted,</text>
  <text x="714" y="882" class="s">not publicly accessible, 1-day automated backups</text>
  <text x="714" y="899" class="s">users, sessions, résumé profiles, jobs, requirement vectors,</text>
  <text x="714" y="916" class="s">processing tasks + transactional outbox</text>
  <text x="714" y="936" class="s">DatabaseSecurityGroup: 5432 from AppSecurityGroup, WorkerSecurityGroup</text>
  <path d="M915,595 L915,820" class="ln"/><path d="M1060,595 L1060,820" class="ln"/>
  <circle cx="1060" cy="700" r="12" fill="#2563eb"/><text x="1056" y="705" class="n">4</text>
  <path d="M760,762 L790,820" class="ln"/>
  <circle cx="790" cy="785" r="12" fill="#2563eb"/><text x="786" y="790" class="n">7</text>

  <rect x="960" y="985" width="330" height="70" class="box"/>
  <text x="972" y="1008" class="t">S3Endpoint</text>
  <text x="972" y="1027" class="s">gateway VPC endpoint on private route</text>
  <text x="972" y="1044" class="s">tables (S3 traffic stays on AWS network)</text>
  <path d="M1250,595 L1250,983" class="ln"/>
  <circle cx="1250" cy="975" r="0" fill="none"/>
  <circle cx="1275" cy="700" r="12" fill="#2563eb"/><text x="1271" y="705" class="n">5</text>
  <path d="M590,762 L590,778 L542,778 L542,1020 L958,1020" class="ln"/>

  <!-- regional services -->
  <rect x="1350" y="100" width="420" height="985" fill="#fffbeb" stroke="#d97706" stroke-dasharray="8 5" rx="8"/>
  <text x="1364" y="122" class="z" fill="#b45309">AWS regional managed services (IAM-scoped)</text>
  <rect x="1365" y="135" width="390" height="125" class="box"/>
  <text x="1378" y="157" class="t">Amazon SQS (SSE)</text>
  <text x="1378" y="177" class="s">ExtractionQueue → ExtractionDlq</text>
  <text x="1378" y="195" class="s">EmbeddingQueue → EmbeddingDlq</text>
  <text x="1378" y="213" class="s">redrive after 5 receives; 900 s visibility</text>
  <text x="1378" y="233" class="s">API outbox publishes; worker long-polls</text>
  <text x="1378" y="250" class="s">(both via NAT, HTTPS 443)</text>
  <rect x="1365" y="275" width="390" height="105" class="box"/>
  <text x="1378" y="297" class="t">TemporaryInputBucket (S3)</text>
  <text x="1378" y="317" class="s">temporary résumé-PDF input only, never served</text>
  <text x="1378" y="335" class="s">1-day expiry · SSE-S3 · public access blocked</text>
  <text x="1378" y="353" class="s">TemporaryInputBucketTlsOnly bucket policy</text>
  <text x="1378" y="371" class="s">objects deleted after terminal extraction</text>
  <path d="M1290,1020 L1335,1020 L1335,330 L1363,330" class="ln"/>
  <rect x="1365" y="395" width="390" height="110" class="box"/>
  <text x="1378" y="417" class="t">AWS Secrets Manager</text>
  <text x="1378" y="437" class="s">inf2006/db-runtime, db-migrator, db-master,</text>
  <text x="1378" y="455" class="s">app-signing-key, duckdns-token</text>
  <text x="1378" y="475" class="s">read at boot into root-only env files;</text>
  <text x="1378" y="493" class="s">never in images, repo or logs</text>
  <rect x="1365" y="520" width="390" height="75" class="box"/>
  <text x="1378" y="542" class="t">Amazon ECR</text>
  <text x="1378" y="562" class="s">inf2006/cloud-api, cloud-web, cloud-bootstrap</text>
  <text x="1378" y="580" class="s">images pulled by immutable sha256 digest</text>
  <rect x="1365" y="610" width="390" height="160" class="box"/>
  <text x="1378" y="632" class="t">Amazon CloudWatch</text>
  <text x="1378" y="652" class="s">Logs (30-day retention): ApiLogGroup, WebLogGroup,</text>
  <text x="1378" y="670" class="s">WorkerLogGroup, API Gateway AccessLogGroup</text>
  <text x="1378" y="690" class="s">Alarms: AppInServiceAlarm, ExtractionAgeAlarm,</text>
  <text x="1378" y="708" class="s">EmbeddingAgeAlarm, ExtractionDlqAlarm,</text>
  <text x="1378" y="726" class="s">EmbeddingDlqAlarm (no notification target)</text>
  <text x="1378" y="746" class="s">Logs Insights: status/route and error queries</text>
  <text x="1378" y="764" class="s">(src/infra/scripts/capture-logs-insights.py)</text>
  <circle cx="1345" cy="680" r="12" fill="#2563eb"/><text x="1341" y="685" class="n">8</text>
  <rect x="1365" y="785" width="390" height="75" class="box"/>
  <text x="1378" y="807" class="t">AWS Systems Manager</text>
  <text x="1378" y="827" class="s">Session Manager admin access: no SSH keys,</text>
  <text x="1378" y="845" class="s">no bastion, no inbound management port</text>
  <rect x="1365" y="875" width="390" height="95" class="box"/>
  <text x="1378" y="897" class="t">IAM: LabRole via LabInstanceProfile</text>
  <text x="1378" y="917" class="s">Learner Lab forbids custom roles, so all instances</text>
  <text x="1378" y="935" class="s">share one lab role; least privilege is enforced by</text>
  <text x="1378" y="953" class="s">network rules and restricted database roles instead</text>
  <rect x="1365" y="985" width="390" height="85" class="box"/>
  <text x="1378" y="1007" class="t">Certificate (ACM import)</text>
  <text x="1378" y="1027" class="s">Let's Encrypt cert for the ALB listener; DNS-01</text>
  <text x="1378" y="1045" class="s">validation via DuckDNS; renewal timer on worker</text>
  <text x="1378" y="1063" class="s">(hostname used for TLS identity, not browsing)</text>

  <!-- NAT egress -->
  <path d="M1290,190 L1363,190" class="eg"/>
  <circle cx="1328" cy="172" r="12" fill="#b45309"/><text x="1324" y="177" class="n">6</text>
  <path d="M1330,700 L1363,700" class="eg"/>

  <!-- legend -->
  <rect x="20" y="1110" width="1765" height="170" fill="#f9fafb" stroke="#d1d5db" rx="8"/>
  <text x="36" y="1134" class="z" fill="#111827">Data flows</text>
  <text x="36" y="1156" class="s">1  Browser → HttpApi over HTTPS: SPA assets and /api on one origin; session cookie plus CSRF header on state-changing requests.</text>
  <text x="36" y="1175" class="s">2  HttpApi → VpcLink → InternalAlb over HTTPS 443 (private integration; API Gateway verifies the listener certificate name).</text>
  <text x="36" y="1194" class="s">3  InternalAlb → app instances over HTTPS 8443 (encrypted; the ALB does not validate the target certificate).  4  API ↔ Database (TCP 5432): sessions, profiles, catalogue, matches; task + outbox rows commit atomically.</text>
  <text x="36" y="1213" class="s">5  API → TemporaryInputBucket via S3Endpoint: uploaded PDF stored temporarily.  6  Private route tables send 0.0.0.0/0 to NatGatewayA/B: outbox → SQS, worker polling, Secrets Manager, ECR, SSM, CloudWatch, Google certificates.</text>
  <text x="36" y="1232" class="s">7  Worker reads the PDF via S3Endpoint, writes the redacted draft and requirement vectors to the Database, then deletes the temporary object.  8  Container logs and metrics → CloudWatch.  G  Google sign-in (ID token verified server-side).</text>
  <text x="36" y="1258" class="s"><tspan font-weight="700">Trust boundaries:</tspan> red = untrusted Internet; orange = AWS account; purple = VPC with private app subnets; blue = database subnets with no Internet route. Only HttpApi is reachable from the Internet.</text>
</svg>
